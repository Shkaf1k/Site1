<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Gaming Hub</title>
    <style>
        :root {
            --bg-color: #0f0f17;
            --card-bg: #1a1a26;
            --accent-color: #00ffcc;
            --text-color: #f0f0f8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--accent-color);
        }

        h1 {
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 8px;
        }

        .status-online {
            color: #00ff66;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            background: var(--accent-color);
            color: #000;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 10px var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Squad Gaming Hub ⚡</h1>
        <p>Наша базовая станция для каток</p>
    </header>

    <div class="container">
        <!-- Блок со статусом -->
        <div class="card">
            <h2>🟢 Кто в сети</h2>
            <ul>
                <li>Player1 — <span class="status-online">в CS2</span></li>
                <li>Player2 — <span class="status-online">в Dota 2</span></li>
                <li>Player3 — оффлайн</li>
            </ul>
        </div>

        <!-- Блок со сборами -->
        <div class="card">
            <h2>📅 Ближайший сбор</h2>
            <p><strong>Игра:</strong> Valorant / Рейтинг</p>
            <p><strong>Время:</strong> Сегодня в 20:00</p>
            <a href="#" class="btn">Зайти в Discord</a>
        </div>

        <!-- Блок с мемом / клипом дня -->
        <div class="card">
            <h2>🔥 Хайлайт недели</h2>
            <p>"Тот самый эйс на эко-раунде"</p>
            <p><em>Автор: Alex_Nitro</em></p>
        </div>
    </div>

</body>
</html>
