<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой GitHub Мессенджер</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #0e1621; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-card { width: 100%; max-width: 450px; height: 80vh; background: #17212b; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .header { padding: 15px; background: #242f3d; text-align: center; font-weight: bold; color: #5288c1; border-bottom: 1px solid #0e1621; }
    .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { background: #2b5278; padding: 10px 14px; border-radius: 10px; max-width: 80%; word-break: break-word; }
    .user-name { font-size: 11px; color: #6ab0ff; font-weight: bold; margin-bottom: 3px; }
    .input-area { display: flex; padding: 12px; background: #17212b; border-top: 1px solid #0e1621; }
    input { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #242f3d; color: #fff; outline: none; margin-right: 8px; }
    button { padding: 10px 16px; border-radius: 6px; border: none; background: #5288c1; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #4370a1; }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="header">GitHub Web Chat</div>
    <div class="messages" id="messages"></div>
    <form class="input-area" id="chat-form">
      <input type="text" id="msg-input" placeholder="Введите сообщение..." autocomplete="off">
      <button type="submit">Отправить</button>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    // ⚠️ ВСТАВЬ СВОИ ДАННЫЕ ИЗ FIREBASE НИЖЕ
    const firebaseConfig = {
      apiKey: "ТВОЙ_API_KEY",
      authDomain: "ТВОЙ_PROJECT.firebaseapp.com",
      projectId: "ТВОЙ_PROJECT_ID",
      storageBucket: "ТВОЙ_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    // Инициализация
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Спрашиваем имя пользователя при входе
    const username = prompt("Введите ваше имя:") || "Аноним";

    const form = document.getElementById('chat-form');
    const input = document.getElementById('msg-input');
    const messagesContainer = document.getElementById('messages');

    // Отправка сообщения в Firebase
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (text) {
        db.collection("messages").add({
          user: username,
          text: text,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
      }
    });

    // Получение сообщений в реальном времени
    db.collection("messages")
      .orderBy("createdAt", "asc")
      .onSnapshot((snapshot) => {
        messagesContainer.innerHTML = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          if (data.text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            msgDiv.innerHTML = `<div class="user-name">${data.user}</div><div>${data.text}</div>`;
            messagesContainer.appendChild(msgDiv);
          }
        });
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });
  </script>
</body>
</html>
