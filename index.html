<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Игра | Официальный сайт</title>
    <style>
        /* Сброс стилей и базовые настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Шапка сайта */
        header {
            background-color: #1a0000;
            border-bottom: 2px solid #ff0000;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        header h1 {
            color: #ff1a1a;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
        }

        /* Главный контент */
        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            flex: 1;
            text-align: center;
        }

        .game-card {
            background-color: #141414;
            border: 1px solid #330000;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .game-title {
            color: #ff3333;
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .game-description {
            color: #ccc;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        /* Заглушка для превью/скриншота */
        .game-preview {
            width: 100%;
            max-width: 600px;
            height: 300px;
            background-color: #1f0000;
            border: 2px dashed #ff0000;
            border-radius: 8px;
            margin: 0 auto 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff6666;
            font-weight: bold;
        }

        /* Красная кнопка */
        .btn-play {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #cc0000, #800000);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .btn-play:hover {
            background: linear-gradient(135deg, #ff0000, #990000);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.9);
            transform: translateY(-2px);
        }

        /* Подвал */
        footer {
            background-color: #050505;
            border-top: 1px solid #222;
            text-align: center;
            padding: 15px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Моя Игровая Студия</h1>
    </header>

    <main>
        <div class="game-card">
            <h2 class="game-title">Название Твоей Игры</h2>
            <p class="game-description">
                Здесь напиши краткое и крутое описание своей игры. Расскажи про сюжет, 
                главные фишки или жанр (например: шутер, платформа, RPG).
            </p>

            <div class="game-preview">
                [ Место для скриншота или трейлера игры ]
            </div>

            <a href="#" class="btn-play">СКАЧАТЬ / ИГРАТЬ</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Все права защищены. Создано мной.</p>
    </footer>

</body>
</html>
