<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Squad Chat</title>
    <style>
        body {
            background-color: #0f0f17;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: #1a1a26;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 450px;
        }

        #chat-screen { display: none; }

        #messages {
            height: 320px;
            overflow-y: auto;
            border: 1px solid #2a2a3a;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 8px;
            background: #12121e;
        }

        .msg { margin-bottom: 8px; word-wrap: break-word; }
        .user { color: #00ffcc; font-weight: bold; }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #2a2a3a;
            background: #09090d;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #00ffcc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00ffcc;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        button:hover {
            background: #00cca3;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
    </style>
</head>
<body>

    <!-- Вход по никнейму -->
    <div id="auth-screen" class="box">
        <h2>🎮 Вход в Squad Hub</h2>
        <input type="text" id="username-input" placeholder="Введи свой никнейм..." onkeydown="if(event.key==='Enter') login()">
        <button onclick="login()">Войти в чат</button>
    </div>

    <!-- Общий чат -->
    <div id="chat-screen" class="box">
        <h2>💬 Чат сквада</h2>
        <div id="messages"></div>
        <input type="text" id="message-input" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <!-- Подключаем библиотеки Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Твой конфиг из Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAG7dEtpPt6oHoMz5MlFR6aNR7phK95MWk",
            authDomain: "sayt-dlya-druzey.firebaseapp.com",
            databaseURL: "https://sayt-dlya-druzey-default-rtdb.firebaseio.com",
            projectId: "sayt-dlya-druzey",
            storageBucket: "sayt-dlya-druzey.firebasestorage.app",
            messagingSenderId: "498949269925",
            appId: "1:498949269925:web:9f58b3d957921b3cd6e04c",
            measurementId: "G-L8F5K30H3C"
        };

        // Инициализация
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = '';

        function login() {
            const nick = document.getElementById('username-input').value.trim();
            if (nick) {
                currentUser = nick;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'block';
                listenMessages();
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text && currentUser) {
                // Отправляем сообщение в коллекцию 'messages'
                db.ref('messages').push({
                    user: currentUser,
                    text: text,
                    timestamp: Date.now()
                });
                input.value = '';
            }
        }

        function listenMessages() {
            // Читаем последние 50 сообщений и получаем новые в реальном времени
            db.ref('messages').limitToLast(50).on('child_added', (snapshot) => {
                const data = snapshot.val();
                const msgBox = document.getElementById('messages');
                
                const p = document.createElement('p');
                p.className = 'msg';
                p.innerHTML = `<span class="user">${escapeHtml(data.user)}:</span> ${escapeHtml(data.text)}`;

                msgBox.appendChild(p);
                msgBox.scrollTop = msgBox.scrollHeight;
            });
        }

        // Защита от XSS
        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[m]));
        }
    </script>
</body>
</html>
