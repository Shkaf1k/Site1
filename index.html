<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Gamer Squad Chat</title>
    <style>
        body {
            background-color: #12121e;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #auth-screen, #chat-screen {
            background: #1e1e2f;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,255,204, 0.2);
            width: 350px;
        }

        #chat-screen { display: none; width: 500px; }

        #messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            background: #181824;
        }

        .msg { margin-bottom: 8px; }
        .system { color: #888; font-style: italic; }
        .user { color: #00ffcc; font-weight: bold; }

        input {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #0f0f17;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #00ffcc;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover { background: #00cca3; }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div id="auth-screen">
        <h2>🎮 Вход в Сквад</h2>
        <input type="text" id="username-input" placeholder="Введи свой никнейм...">
        <button onclick="login()">Войти</button>
    </div>

    <!-- Экран чата -->
    <div id="chat-screen">
        <h2>💬 Чат сквада</h2>
        <div id="messages"></div>
        <input type="text" id="message-input" placeholder="Напиши что-нибудь...">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function login() {
            const username = document.getElementById('username-input').value.trim();
            if (username) {
                socket.emit('join', username);
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'block';
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            if (input.value.trim()) {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        }

        socket.on('chat message', (data) => {
            const msgBox = document.getElementById('messages');
            const p = document.createElement('p');
            p.className = 'msg';
            
            if (data.system) {
                p.classList.add('system');
                p.innerText = data.text;
            } else {
                p.innerHTML = `<span class="user">${data.user}:</span> ${data.text}`;
            }

            msgBox.appendChild(p);
            msgBox.scrollTop = msgBox.scrollHeight;
        });
    </script>
</body>
</html>
